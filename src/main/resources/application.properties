spring.application.name=url-shortener
server.port=8080

# Perfil padrão: dev (H2)
spring.profiles.active=dev

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Cache
spring.cache.type=caffeine
spring.cache.cache-names=urls
# 5 minutos de TTL, máximo 10 mil entradas em memória
spring.cache.caffeine.spec=maximumSize=10000,expireAfterWrite=5m

# OpenAPI
springdoc.swagger-ui.path=/swagger-ui.html

# Logging
logging.level.com.lubj9.urlshortener=DEBUG

# Domínio base — usado para montar a URL curta na resposta
app.base-url=http://localhost:8080
